packages:
  - packages/*

# native binaries; core-js only prints a banner
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - unrs-resolver
ignoredBuiltDependencies:
  - core-js
  - core-js-pure

# one copy of each, shared by the app and mdsmirror
overrides:
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  prosemirror-model: 1.25.12
  prosemirror-state: 1.4.4
  prosemirror-transform: 1.12.4
  prosemirror-view: 1.42.8
  react: 19.3.1
  react-dom: 19.3.1
  styled-components: 6.6.0
