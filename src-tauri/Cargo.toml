[package]
name = "mdsilo"
version = "0.7.0"
description = "mdSilo Desktop"
authors = ["dloh"]
license = "AGPL-3.0-or-later"
repository = ""
default-run = "mdsilo"
edition = "2024"
rust-version = "1.90.0"

[lib]
name = "mdsilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2.13.1"
dirs = "7.0.0"
trash = "5.2.2"
notify = "8.2.1"
open = "5.4.5"
bincode = { version = "2.0.1", features = ["serde"] }
chrono = "0.4.41"
whatlang = "0.18.0"
# book ids, see books.rs
md5 = { package = "md-5", version = "0.11.0" }
# the index of a workspace, see index/
fancy-regex = "0.20.0"
regex = "1"
percent-encoding = "2.3.2"
tantivy = "0.27.0"
tantivy-jieba = "0.21.0"
# walk dir
crossbeam = "0.8.4"
ignore = "0.4.33"
indextree = "4.9.2"
## rss reader
reqwest = { version = "0.13.5", features = ["json", "socks"] }
rss = { version = "2.0.12", features = ["serde"] }
atom_syndication = "0.12.7"
bytes = "1.10.1"
diesel = { version = "2.3.14", features = ["sqlite", "chrono"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devUrl` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
strip = true 
lto = true
opt-level = "s"
