<!doctype html>
<html>
<head><meta charset="utf-8"><title>Text Stats</title></head>
<body>
<script>
// Answers `selection.action` on the text selected, and the commands on the
// note open in the editor (editor.blocks, editor.mark), see
// examples/plugins/README.md

// words of scripts without spaces (CJK) count one per character
const CJK = /[぀-ヿ㐀-鿿가-힯]/g;
function wordsOf(text) {
  const cjk = (text.match(CJK) ?? []).length;
  return text.replace(CJK, ' ').split(/\s+/).filter((w) => /[\p{L}\p{N}]/u.test(w)).length + cjk;
}

function stats(text) {
  const words = wordsOf(text);
  const sentences = (text.match(/[^.!?。！？]+[.!?。！？]+/g) ?? []).length || (text.trim() ? 1 : 0);
  const minutes = Math.max(1, Math.round(words / 230));
  return `<p><b>${words}</b> words, <b>${text.length}</b> characters, <b>${sentences}</b> sentences.</p>`
    + `<p>About ${minutes} min to read.</p>`;
}

// calls to the app, answered by id
let calls = 0;
const waiting = new Map();
const call = (method, params) =>
  new Promise((resolve, reject) => {
    const id = ++calls;
    waiting.set(id, { resolve, reject });
    parent.postMessage({ mdsilo: 1, id, method, params }, '*');
  });

/** All the blocks of text of the note open in the editor */
async function allBlocks() {
  const blocks = [];
  let from = 0;
  while (from !== undefined) {
    const res = await call('editor.blocks', { from, count: 500 });
    blocks.push(...res.blocks);
    from = res.next;
  }
  return blocks;
}

const LONG = 80;
const RATHER_LONG = 50;

/** The long paragraphs marked: red over 80 words, yellow over 50 */
async function markLong() {
  await call('editor.clearMarks');
  let long = 0;
  let ratherLong = 0;
  for (const block of await allBlocks()) {
    const words = wordsOf(block.text);
    if (words > LONG) long++;
    else if (words > RATHER_LONG) ratherLong++;
    else continue;
    await call('editor.mark', { block: block.index, color: words > LONG ? 'red' : 'yellow' });
  }
  if (!long && !ratherLong) return `No paragraph over ${RATHER_LONG} words.`;
  return { html: `<p><b>${long}</b> paragraphs over ${LONG} words (red), <b>${ratherLong}</b> over ${RATHER_LONG} (yellow).</p>` };
}

const COMMANDS = {
  long: markLong,
  clear: async () => {
    await call('editor.clearMarks');
  },
};

window.addEventListener('message', async (event) => {
  const msg = event.data;
  if (event.source !== parent || !msg || msg.mdsilo !== 1) return;
  // the answer to a call of ours
  if ('id' in msg && waiting.has(msg.id)) {
    const { resolve, reject } = waiting.get(msg.id);
    waiting.delete(msg.id);
    return msg.error ? reject(new Error(msg.error)) : resolve(msg.result);
  }
  if (msg.request === undefined) return;
  const reply = (answer) => parent.postMessage({ mdsilo: 1, reply: msg.request, ...answer }, '*');
  try {
    if (msg.method === 'selection.action' && msg.params.action === 'count')
      reply({ result: { html: stats(msg.params.text) } });
    else if (msg.method === 'command.run' && COMMANDS[msg.params.command])
      reply({ result: await COMMANDS[msg.params.command]() });
    else reply({ error: `Unknown method: ${msg.method}` });
  } catch (e) {
    reply({ error: e.message });
  }
});
</script>
</body>
</html>
